name: Playwright BDD

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  bdd-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright install-deps

      - name: Run BDD tests on all browsers
        run: npm run test:bdd:multi

      - name: Restore executions metadata cache
        uses: actions/cache@v4
        with:
          path: reports/executions.json
          key: ${{ runner.os }}-executions-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-executions-

      - name: Generate HTML report
        if: always()
        env:
          GITHUB_WORKFLOW_STATUS: ${{ job.status }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run report:bdd

      - name: Prepare Pages artifact
        if: always()
        run: |
          mkdir -p public
          if [ -f reports/cucumber-report.html ]; then
            cp reports/cucumber-report.html public/index.html
          else
            echo 'cucumber-report.html not found; creating a placeholder page.'
            printf '<html><body><h1>BDD report unavailable</h1></body></html>' > public/index.html
          fi
          if ls reports/*.html >/dev/null 2>&1; then
            for f in reports/*.html; do
              cp "$f" "public/$(basename "$f")"
            done
          fi

      - name: Upload Pages artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-report
          path: reports/
          if-no-files-found: warn

      - name: Send email on failure
        if: ${{ always() && failure() }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$SMTP_FROM" ] && [ -n "$SMTP_TO" ]; then
            python3 - <<'PY'
            import os
            import smtplib
            import ssl
            from email.message import EmailMessage

            msg = EmailMessage()
            msg['Subject'] = 'Playwright BDD test run failed'
            msg['From'] = os.environ['SMTP_FROM']
            msg['To'] = os.environ['SMTP_TO']
            msg.set_content('The scheduled Playwright BDD run failed. Please open the GitHub Actions run and the generated report for details.')

            context = ssl.create_default_context()
            with smtplib.SMTP(os.environ['SMTP_SERVER'], int(os.environ['SMTP_PORT'])) as server:
                server.starttls(context=context)
                server.login(os.environ['SMTP_USERNAME'], os.environ['SMTP_PASSWORD'])
                server.send_message(msg)
            PY
          else
            echo 'SMTP secrets not configured; skipping email notification.'
          fi

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: bdd-tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
